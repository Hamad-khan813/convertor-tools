<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glowing Orbs -->
  <circle cx="950" cy="150" r="300" fill="#10b981" opacity="0.08" filter="blur(80px)" />
  <circle cx="250" cy="500" r="250" fill="#6366f1" opacity="0.05" filter="blur(80px)" />

  <!-- Abstract Precision Curves -->
  <path d="M-100,500 C300,450 400,200 800,250 C1000,275 1100,150 1300,100" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M-100,520 C300,470 400,220 800,270 C1000,295 1100,170 1300,120" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- Wave area glow -->
  <path d="M-100,500 C300,450 400,200 800,250 C1000,275 1100,150 1300,100 L1300,630 L-100,630 Z" fill="url(#glowGrad)" />

  <!-- Grid overlay lines (Tech dashboard details) -->
  <line x1="100" y1="100" x2="100" y2="530" stroke="#27272a" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
  <line x1="100" y1="530" x2="1100" y2="530" stroke="#27272a" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
  
  <!-- Tiny dots on intersection -->
  <circle cx="100" cy="530" r="4" fill="#10b981" />
  <circle cx="800" cy="250" r="6" fill="#14b8a6" />
  <circle cx="800" cy="250" r="12" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.5" />

  <!-- Brand Content Container -->
  <g transform="translate(150, 180)">
    <!-- Micro-badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="36" rx="18" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#10b981" />
      <text x="38" y="23" fill="#10b981" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">400+ DYNAMIC SOLVERS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="72" font-weight="900" letter-spacing="-2">Convertly</text>
    
    <!-- Title gradient underline -->
    <rect x="0" y="135" width="280" height="6" rx="3" fill="url(#accentGrad)" />

    <!-- Subheadline / Tagline -->
    <text x="0" y="190" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="500" letter-spacing="0.5">
      Universal Unit Converter &amp; Calculator Suite
    </text>
    <text x="0" y="225" fill="#71717a" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5">
      NIST Audited Formulas • Double-Precision • Zero Tracking
    </text>
  </g>

  <!-- Mockup Calculator Widget (Decorative UI on the right) -->
  <g transform="translate(760, 200)">
    <!-- Widget background Card -->
    <rect width="340" height="280" rx="24" fill="#09090b" fill-opacity="0.8" stroke="#27272a" stroke-width="2" />
    
    <!-- Card header/tabs -->
    <rect x="20" y="20" width="80" height="8" rx="4" fill="#10b981" />
    <rect x="110" y="20" width="60" height="8" rx="4" fill="#27272a" />
    <rect x="180" y="20" width="60" height="8" rx="4" fill="#27272a" />

    <!-- Calculator Display -->
    <rect x="20" y="48" width="300" height="64" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <text x="285" y="90" fill="#ffffff" font-family="'Courier New', monospace" font-size="28" font-weight="bold" text-anchor="end">1,489.201</text>
    <text x="35" y="70" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="800">INPUT METRIC</text>

    <!-- Keypad Preview (Grids) -->
    <rect x="20" y="132" width="65" height="40" rx="10" fill="#27272a" opacity="0.5" />
    <rect x="100" y="132" width="65" height="40" rx="10" fill="#27272a" opacity="0.5" />
    <rect x="180" y="132" width="65" height="40" rx="10" fill="#27272a" opacity="0.5" />
    <rect x="255" y="132" width="65" height="40" rx="10" fill="#10b981" />
    <text x="287.5" y="157" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">=</text>

    <rect x="20" y="187" width="65" height="40" rx="10" fill="#18181b" stroke="#27272a" />
    <rect x="100" y="187" width="65" height="40" rx="10" fill="#18181b" stroke="#27272a" />
    <rect x="180" y="187" width="65" height="40" rx="10" fill="#18181b" stroke="#27272a" />
    <rect x="255" y="187" width="65" height="40" rx="10" fill="#27272a" opacity="0.5" />
    
    <rect x="20" y="240" width="300" height="2" fill="#27272a" opacity="0.5" />
  </g>
</svg>
